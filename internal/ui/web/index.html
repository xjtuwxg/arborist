<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arborist</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Arborist">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-7m0 0-4-4m4 4 4-4M12 11V7m0 0L9 4m3 3 3-3" /><circle cx="8" cy="11" r="1.6"/><circle cx="16" cy="11" r="1.6"/><circle cx="9" cy="4" r="1.6"/><circle cx="15" cy="4" r="1.6"/></svg>
      <span>Arborist</span>
    </div>
    <div class="machine" id="machine"></div>

    <div class="nav" id="nav">
      <button data-view="files" aria-current="page"><span class="ico" data-icon="folder"></span>Files</button>
      <button data-view="history"><span class="ico" data-icon="history"></span>History</button>
      <button data-view="trash"><span class="ico" data-icon="trash"></span>Trash<span class="count" id="trash-count" hidden></span></button>
    </div>

    <div class="ai">
      <div class="label">AI</div>
      <label class="field"><span>Provider</span><select id="provider"></select></label>
      <label class="field"><span>Model</span><select id="model"></select></label>
      <label class="field" id="model-other" hidden><span>Model name</span><input id="model-custom" placeholder="Name the tool accepts" autocomplete="off" spellcheck="false"></label>
      <p class="hint" id="ai-hint"></p>
      <button class="ghost" id="btn-rescan-ai">Look for AI tools again</button>
    </div>
  </nav>

  <div class="main">
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="actions" id="actions">
        <button id="btn-ignore" class="ghost" hidden></button>
        <button id="btn-scan"><span class="ico" data-icon="scan"></span><span>Scan references</span></button>
        <button id="btn-analyze"><span class="ico" data-icon="spark"></span><span>Analyze</span></button>
        <button id="btn-dry" class="primary" disabled><span class="ico" data-icon="split"></span><span>Tidy up…</span></button>
      </div>
    </header>

    <div class="banner" id="welcome" hidden></div>

    <div class="content" id="view-files">
      <section class="files">
        <table id="files">
          <thead><tr>
            <th>Name</th><th class="ai-col">What it is</th><th class="ai-col">Status</th>
            <th class="num">Size</th><th>Modified</th>
            <th class="num" title="References from other places into this entry">In</th>
            <th class="num" title="References from inside this entry to the workspace">Out</th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <p class="empty" id="files-empty" hidden></p>
      </section>
      <aside class="inspector">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="analysis" aria-selected="true">Analysis</button>
          <button role="tab" data-tab="refs">References</button>
          <button role="tab" data-tab="preview">Preview</button>
        </div>
        <div class="panel" id="tab-analysis"></div>
        <div class="panel" id="tab-refs" hidden></div>
        <div class="panel" id="tab-preview" hidden><p class="muted">Select a file to preview it.</p></div>
      </aside>
    </div>

    <div class="content single" id="view-history" hidden></div>
    <div class="content single" id="view-trash" hidden></div>

    <footer id="jobs"></footer>
  </div>
</div>

<div class="overlay" id="dry" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dry-title">
    <header>
      <div>
        <h2 id="dry-title">Review before tidying</h2>
        <p class="muted" id="dry-sub"></p>
      </div>
      <button class="ghost" id="dry-close" aria-label="Close">Close</button>
    </header>
    <div class="dry-body">
      <section class="dry-steps"><h3>Steps</h3><div id="dry-steps"></div></section>
      <section class="dry-tree"><h3>Now</h3><div class="tree" id="dry-before"></div></section>
      <section class="dry-tree"><h3>After</h3><div class="tree" id="dry-after"></div></section>
    </div>
    <footer>
      <div id="dry-summary"></div>
      <div class="actions">
        <button id="dry-cancel">Cancel</button>
        <button class="primary" id="dry-apply">Apply</button>
      </div>
    </footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
